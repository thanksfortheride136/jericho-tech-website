<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jericho Technology Program</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* GLOBAL RESET TO REMOVE EDGE LINES */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;        /* removes thin scrollbar line */
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* Container between header and footer */
    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - var(--header-h) - var(--footer-h));
      background: #fff;
      overflow: hidden;
      border: none;
      outline: none;
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      background: #fff;
      border: none;
      outline: none;
    }

    header.site-header {
      background: #fff;
      z-index: 1000;
    }

    footer.site-footer {
      background: #fff;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header" id="header">
    <div class="nav-bar">
      <a class="brand" href="index.html" aria-label="Jericho Technology">
        <span class="brand-line1">Jericho</span>
        <span class="brand-line2">Technology</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="courses.html">Courses</a></li>
          <li><a href="program.html" class="active">Program Overview</a></li>
          <li><a href="#projects">Project Gallery</a></li>
          <li><a href="#software">Equipment</a></li>
          <li><a href="#atlas">ATLAS</a></li>
          <li><a href="graphite.html">Graphite</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- IMAGE SECTION -->
  <div class="image-wrapper">
    <!-- Replace with your actual image path -->
    <img src="pictures/test.png" alt="Jericho Technology Program course sequence">
  </div>

  <!-- FOOTER -->
  <footer class="site-footer" id="footer">
    <div class="container">
      <small>© <span id="year"></span> Jericho UFSD • Technology Department</small>
    </div>
  </footer>

  <script>
    // Dynamically set header/footer height for proper image fitting
    function adjustImageHeight() {
      const header = document.getElementById('header').offsetHeight;
      const footer = document.getElementById('footer').offsetHeight;
      document.documentElement.style.setProperty('--header-h', header + 'px');
      document.documentElement.style.setProperty('--footer-h', footer + 'px');
    }

    window.addEventListener('load', adjustImageHeight);
    window.addEventListener('resize', adjustImageHeight);

    // Auto year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
