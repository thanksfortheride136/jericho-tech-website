<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jericho Technology Program</title>

  <!-- ✅ Existing site styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Pan/Zoom for SVG -->
  <script src="https://unpkg.com/svg-pan-zoom/dist/svg-pan-zoom.min.js"></script>

  <style>
    :root{
      --top-offset: 64px;  /* Adjust to match your nav bar height */
      --blue:#1e3a8a;
      --line:#3b82f6;
      --core:#eff6ff;
      --ms:#eefce8;
      --hs:#fff7ed;
      --text:#0f172a;
      --hint-bg: rgba(255,255,255,.85);
    }

    html, body { height: 100%; margin: 0; }
    body { background:#f3f4f6; color:var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    /* Full-screen SVG canvas below navbar */
    .canvas {
      position: fixed;
      top: var(--top-offset);
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      overflow: hidden;
      z-index: 0;
    }

    .canvas svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Node styles */
    .node text{font-size:12px; dominant-baseline:middle; text-anchor:middle; fill:var(--text)}
    .core rect{fill:var(--core); stroke:var(--line); stroke-width:2}
    .ms   rect{fill:var(--ms);   stroke:#16a34a; stroke-width:2}
    .hs   rect{fill:var(--hs);   stroke:#ea580c; stroke-width:2}
    .edge {stroke:var(--line); stroke-width:2; fill:none}
    .arrow{marker-end:url(#arrow)}

    /* Floating hint */
    .hint {
      position: fixed;
      right: 12px;
      top: calc(var(--top-offset) + 12px);
      background: var(--hint-bg);
      backdrop-filter: blur(6px);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: #475569;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- ✅ NAVBAR FROM YOUR ORIGINAL FILE -->
  <header class="site-header">
    <div class="nav-bar">
      <a class="brand" href="index.html" aria-label="Jericho Technology">
        <span class="brand-line1">Jericho</span>
        <span class="brand-line2">Technology</span>
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-label="Toggle menu">☰</button>
      <nav class="nav" aria-label="Primary">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="courses.html">Courses</a></li>
          <li><a href="program.html" class="active">Program Overview</a></li>
          <li><a href="#projects">Project Gallery</a></li>
          <li><a href="#software">Equipment</a></li>
          <li><a href="#atlas">ATLAS</a></li>
          <li><a href="graphite.html">Graphite</a></li>

        <path d="M 1015,350 H 1035"/><path d="M 1225,350 H 1245"/><path d="M 1435,350 H 1455"/><path d="M 1645,350 H 1665"/>
        <path d="M 1855,350 H 1875"/><path d="M 2065,350 H 2085"/>

      </g>
    </svg>
  </div>

  <footer class="site-footer">
